<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terrabird</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">

<!-- ============================== STYLES ============================== -->
<style>
:root{--bg:#d9dde8;--ink:#1d2433;--btn:#ffffffcc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d14;--ink:#e8ecf2;--btn:#1d2433cc}}
:root[data-theme="dark"]{--bg:#0b0d14;--ink:#e8ecf2;--btn:#1d2433cc}

html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Press Start 2P",monospace}

#wrap{position:relative}
canvas{display:block;image-rendering:pixelated;outline:none;border:4px solid #1d2433;box-shadow:6px 6px 0 #0006}

#mute,#pauseBtn{position:absolute;top:12px;width:38px;height:38px;padding:5px;background:#c49a6c;border:3px solid #5a3a1e;box-shadow:2px 2px 0 #0006;color:#3b2412;cursor:pointer}
#mute{right:12px}
#pauseBtn{left:12px}
#mute:focus-visible,#pauseBtn:focus-visible{outline:3px solid #ffd23f}
/* Store */
[hidden]{display:none!important}
#storeBtn{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:60px;height:60px;padding:4px;background:#c49a6c;border:4px solid #5a3a1e;box-shadow:3px 3px 0 #0006;cursor:pointer}
#storeBtn:focus-visible,#store button:focus-visible{outline:3px solid #ffd23f}
#store{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;padding:14px;box-sizing:border-box}
#store .panel{width:100%;height:100%;max-height:560px;display:flex;flex-direction:column;gap:8px;background:#c49a6c;border:4px solid #5a3a1e;padding:10px;box-sizing:border-box;color:#3b2412;font-size:10px}
#store .head{display:flex;align-items:center;justify-content:space-between;font-size:14px}
#store button{font:inherit;color:#3b2412;background:#e0c49a;border:3px solid #5a3a1e;padding:6px 8px;cursor:pointer}
#store button:disabled{opacity:.6;cursor:default}
#store .tabs{display:flex;gap:6px}
#store .tabs button{flex:1;font-size:8px;padding:6px 2px}
#store .tabs button.on{background:#8a5a2e;color:#fff}
#storeMsg{min-height:12px;font-size:8px;color:#8a1f1f}
#storeItems{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;border:4px solid #5a3a1e;background:#d8b88c;padding:8px;display:flex;flex-direction:column;gap:8px}
#storeItems .item{display:flex;align-items:center;gap:8px;background:#e8d0a8;border:3px solid #5a3a1e;padding:6px}
#storeItems .nm{flex:1}
#storeItems .d{font-size:7px;opacity:.8;line-height:1.6}
#storeItems .sw{width:28px;height:28px;border:3px solid #5a3a1e;flex:none}
#storeItems .soon{text-align:center;margin:auto;font-size:12px}
</style>
</head>

<!-- ============================== PAGE ============================== -->
<body>
<div id="wrap">
  <canvas id="c" tabindex="0" aria-label="Terrabird game"></canvas>
  <button id="mute" aria-label="Toggle sound" title="Sound on/off">♪</button>
  <button id="pauseBtn" aria-label="Pause" title="Pause (P)" hidden>
    <svg viewBox="0 0 12 12" width="24" height="24" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true"><rect x="3" y="2" width="2" height="8"/><rect x="7" y="2" width="2" height="8"/></svg>
  </button>
  <button id="storeBtn" aria-label="Open store" title="Store" hidden>
    <svg viewBox="0 0 16 16" width="44" height="44" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="1" y="2" width="14" height="4" fill="#d9382e"/>
      <rect x="3" y="2" width="2" height="4" fill="#fff"/><rect x="7" y="2" width="2" height="4" fill="#fff"/><rect x="11" y="2" width="2" height="4" fill="#fff"/>
      <rect x="1" y="6" width="2" height="1" fill="#d9382e"/><rect x="5" y="6" width="2" height="1" fill="#d9382e"/><rect x="9" y="6" width="2" height="1" fill="#d9382e"/><rect x="13" y="6" width="2" height="1" fill="#d9382e"/>
      <rect x="2" y="7" width="1" height="5" fill="#5a3a1e"/><rect x="13" y="7" width="1" height="5" fill="#5a3a1e"/>
      <rect x="5" y="8" width="2" height="2" fill="#ffd23f"/><rect x="8" y="8" width="2" height="2" fill="#f08a2e"/>
      <rect x="1" y="10" width="14" height="5" fill="#8a5a2e"/><rect x="1" y="10" width="14" height="1" fill="#5a3a1e"/>
    </svg>
  </button>
  <div id="store" hidden role="dialog" aria-label="Store">
    <div class="panel">
      <div class="head"><span>STORE</span><span id="storeCoins"></span><button id="storeClose" aria-label="Close store">X</button></div>
      <div class="tabs">
        <button data-tab="skins">SKINS</button>
        <button data-tab="trails">TRAILS</button>
        <button data-tab="awards">AWARDS</button>
        <button data-tab="soon">SOON</button>
      </div>
      <div id="storeMsg"></div>
      <div id="storeItems"></div>
    </div>
  </div>
</div>

<script>
(function(){

/* =====================================================================
   1. CONFIG: change these numbers to tune the game
   ===================================================================== */

// Canvas (the game's internal size; it is scaled to fit the screen)
const W = 360;
const H = 640;

// Fox
const FOX_X      = 100;  // horizontal position (fixed)
const FOX_RADIUS = 12;   // hitbox size
const FOX_SPEED  = 230;  // pixels/second, same going up or down

// Pipes
const PIPE_W        = 58;   // pillar width
const PIPE_SPACING  = 215;  // horizontal distance between pipes
const PIPE_SPEED_START = 130;  // pixels/second at score 0
const PIPE_SPEED_MAX   = 200;  // top speed
const PIPE_SPEED_PER_POINT = 2.5;  // speed gained per point

// Gaps
const GAP_START      = 158;  // gap height at score 0
const GAP_MIN        = 122;  // smallest gap
const GAP_SHRINK     = 1.2;  // gap lost per point
const GAP_MARGIN     = 36;   // keeps gaps away from ceiling and floor
const GAP_REACH      = 0.62; // how far a gap may shift vs. what the fox can reach (lower = easier)
const EXTREME_FROM_SCORE = 8;    // from this score, gaps may swing top-to-bottom
const EXTREME_CHANCE     = 0.35; // chance of such a swing

// Timing
const STEP = 1/120;  // physics step in seconds

// Coins
const COIN_PER_PIPE = 1;  // coins earned per pipe passed

// Store items. tab: 'skins' or 'trails'. price 0 = owned from the start.
// A skin's colors replace the glider's P (main) and S (shade) pixels.
const ITEMS = [
  {id:'skin-white',  tab:'skins',  name:'CLASSIC', price:0,  colors:{P:'#ffffff', S:'#c4cddc'}},
  {id:'skin-red',    tab:'skins',  name:'RED',     price:10, colors:{P:'#e8483c', S:'#a82a22'}},
  {id:'skin-blue',   tab:'skins',  name:'SKY',     price:10, colors:{P:'#5ec8f2', S:'#2f8fc0'}},
  {id:'skin-green',  tab:'skins',  name:'MINT',    price:15, colors:{P:'#7be0a4', S:'#3fa86a'}},
  {id:'skin-gold',   tab:'skins',  name:'GOLD',    price:30, colors:{P:'#ffd23f', S:'#d9a21b'}},
  {id:'trail-none',     tab:'trails', name:'NONE',     price:0},
  {id:'trail-gradient', tab:'trails', name:'GRADIENT', price:15},
  {id:'trail-smoke',    tab:'trails', name:'SMOKE',    price:20},
  {id:'trail-confetti', tab:'trails', name:'CONFETTI', price:30},
  {id:'trail-rainbow',  tab:'trails', name:'RAINBOW',  price:50}
];

// Secret dimensions. Some pipes are portals: crash into one to enter, or fly through its gap to stay home.
const PORTAL_CHANCE   = 1/50;  // chance a new pipe is a portal to ANY dimension (split evenly among the ready ones)
const DIMENSION_COIN_MULT = 2;   // coins per pipe are multiplied inside a dimension
const DIMENSION_PIPES = 50;    // pipes to survive in a dimension to return home
const DIMENSIONS = {
  backrooms: {
    name:'THE BACKROOMS', ready:true,
    pipe:{body:'#1f4e4b', light:'#2a6662', dark:'#143533', outline:'#0a0f14'},   // portal pipe at home: a darker shade
    wall:{body:'#c8b560', light:'#b39f4a', dark:'#7a6b2a', outline:'#4a4118'},   // walls inside (replace pipes)
    wallpaper:'#bfac55', stripe:'#b09c48', ceiling:'#d8d2b0', light:'#fffbd0', carpet:'#8c7d3a', carpetDot:'#7a6c30',
    // Lights: per 10 pipes (0-9, 10-19, ... 40-49), the chance a light is off, and how dark the room gets
    flicker:[0.04, 0.2, 0.4, 0.6, 1],
    dark:[0, 0.12, 0.25, 0.4, 0.7],
    monsterFrom:35,                 // the monster appears at this pipe
    monsterDelay:[0.75, 0.38]       // seconds behind you at pipe 35 and at the exit (smaller = closer)
  },
  mario: {
    name:'MARIO WORLD', ready:true,
    pipe:{body:'#1faa1f', light:'#6cf05c', dark:'#0e6e0e', outline:'#1d2433'},   // portal pipe at home
    wall:{body:'#00a800', light:'#80f060', dark:'#006800', outline:'#000000'},   // pipes inside
    sky:'#5c94fc', cloud:'#ffffff', cloudShade:'#bcd8fc',
    hill:'#00a800', hillDark:'#006800',
    brick:'#c84c0c', brickLight:'#fc9838', brickLine:'#000000'
  },
  reverse: {name:'REVERSE WORLD', ready:false}    // not built yet
};

// Mario world
const MARIO_GROUND      = 32;   // brick floor height (the fox crashes into it, pipes stand on it)
const COIN_R            = 10;   // coin size, also used for pickup
const MARIO_COIN_CHANCE = 0.9;  // chance a pair of pipes gets a coin
const COIN_STEP         = 4;    // px between the heights the placement code tests
// best / worst = slack ranges (see the explanation). safe:true = timing built so ANY start spot works.
// weight = how often; ramp = weight change per pipe survived in the dimension (harder coins later)
const COIN_TIERS = [
  {name:'easy',   value:1, weight:5, ramp:-0.02, safe:true,  worst:[0.15, 1], best:[0, 1],       color:'#ffd23f', shine:'#fff3b0'},
  {name:'medium', value:2, weight:3, ramp:0,     safe:false, worst:[-99, 0],  best:[0.25, 1],    color:'#5ec8f2', shine:'#d6f3ff'},
  {name:'hard',   value:5, weight:1, ramp:0.02,  safe:false, worst:[-99, 1],  best:[0.02, 0.12], color:'#e8483c', shine:'#ffc0b8'}
];

// Trails
const TRAIL_INTERVAL = 0.02;  // seconds between trail particles (lower = denser)
const CONFETTI_COLORS = ['#e8483c','#ffd23f','#7be0a4','#5ec8f2','#f08ac8'];
const RAINBOW_COLORS  = ['#e8483c','#f08a2e','#ffd23f','#7be0a4','#5ec8f2','#a07be8'];

// Achievements. stat: 'score' (one run) or a lifetime count (totalPipes, flips, runs, purchases)
const ACHIEVEMENTS = [
  {id:'a-score1',   name:'FIRST FLIGHT',   desc:'SCORE 1 IN A RUN',  stat:'score',      goal:1,   reward:2},
  {id:'a-score10',  name:'DOUBLE DIGITS',  desc:'SCORE 10 IN A RUN', stat:'score',      goal:10,  reward:5},
  {id:'a-score25',  name:'HIGH FLYER',     desc:'SCORE 25 IN A RUN', stat:'score',      goal:25,  reward:15},
  {id:'a-score50',  name:'SKY MASTER',     desc:'SCORE 50 IN A RUN', stat:'score',      goal:50,  reward:40},
  {id:'a-pipes100', name:'PILLAR PASSER',  desc:'PASS 100 PILLARS',  stat:'totalPipes', goal:100, reward:50},
  {id:'a-flips200', name:'FLIP FLOPPA',    desc:'FLIP GRAVITY 200X', stat:'flips',      goal:200, reward:20},
  {id:'a-runs100',  name:'DEDICATED',      desc:'CRASH 100 TIMES',   stat:'runs',       goal:100, reward:10},
  {id:'a-buy1',     name:'FIRST PURCHASE', desc:'BUY AN ITEM',       stat:'purchases',  goal:1,   reward:5},
  {id:'a-dim1',     name:'ANOTHER WORLD',  desc:'ENTER A DIMENSION',     stat:'dimsSeen',   goal:1,   reward:15},
  {id:'a-dimall',   name:'MULTIVERSE',     desc:'ENTER EVERY DIMENSION', stat:'dimsSeen',   goal:Object.keys(DIMENSIONS).length, reward:100},
  {id:'a-dim10',    name:'DIMENSION HOPPER', desc:'ENTER DIMENSIONS 10X', stat:'dimEntered', goal:10,  reward:30},
  {id:'a-dimdie',   name:'LOST FOR GOOD',  desc:'DIE IN A DIMENSION',    stat:'dimDeaths',  goal:1,   reward:10},
  {id:'a-home10',   name:'HOMEWARD BOUND', desc:'RETURN HOME 10X',       stat:'dimReturns', goal:10,  reward:75},
  {id:'a-mcoin25', name:'COIN COLLECTOR', desc:'GRAB 25 MARIO COINS', stat:'marioCoins', goal:25, reward:20},
  {id:'a-redcoin', name:'RED HOT',        desc:'GRAB 5 RED COINS',    stat:'hardCoins',  goal:5,  reward:40}
];

// Sky by time of day. sky = 6 bands (top to bottom), cloud = cloud color, stars = star visibility 0-1
const SKY_PALETTES = {
  night:  {sky:['#0b0e24','#12183a','#1b2150','#262a63','#343a78','#454a8c'], cloud:'#3a3f78', stars:1},
  dawn:   {sky:['#2b3470','#51508f','#8a6a9e','#d78fa0','#f2b28c','#f8d29a'], cloud:'#a889b8', stars:0.4},
  day:    {sky:['#3b97e0','#58abe9','#75bdef','#92cff4','#b0dff8','#cdeefb'], cloud:'#ffffff', stars:0},
  sunset: {sky:['#1b1f4b','#2b2f6b','#4a3a85','#8a4a8c','#d9737a','#f0a070'], cloud:'#6a5aa8', stars:0.6}
};
// [hour of day 0-24, palette]. The sky blends smoothly between neighbors.
const SKY_SCHEDULE = [[0,'night'],[5,'night'],[6.5,'dawn'],[8,'day'],[17,'day'],[18.5,'sunset'],[20.5,'night'],[24,'night']];

// Colors
const PIPE_COLORS = {body:'#2f8f8a', light:'#46b3ab', dark:'#206b67', outline:'#1d2433'};
const STARS = [[30,40],[90,120],[170,60],[250,150],[320,50],[60,220],[290,260],[200,200],[140,300],[330,330]]; // [x, y]

// Fox picture: each letter is one pixel (see FOX_COLORS). "." = empty.
const FOX_COLORS = {P:'#ffffff', S:'#c4cddc', W:'#ffffff', K:'#1d2433', O:'#f08a2e', N:'#1d2433', G:'#9aa0aa', Y:'#ffd23f'};
const FOX_SPRITE = [
  "..........KKK...",
  "......KKKKPPPPK.",
  "..KKKKPPPPPPPPPK",
  "KKPPPPPPSSSSSSK.",
  ".KKSSSSSSKKKKK..",
  "....K..K.O...O..",
  "...OOOOOOOOOOOO.",
  "..OOOOOOOOOKOWWN",
  "WWOOOOOOOOOOWWW.",
  "....OO.OO..OGY..",
  "............GG.."
];
const SPRITE_PIXEL = 3; // size of one sprite pixel on screen


/* =====================================================================
   2. SETUP: canvas and screen scaling
   ===================================================================== */

const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');

function resize(){
  const scale = Math.min(window.innerWidth/W, window.innerHeight/H) * 0.98;
  const dpr = window.devicePixelRatio || 1;
  cv.style.width  = W*scale + 'px';
  cv.style.height = H*scale + 'px';
  cv.width  = Math.round(W*scale*dpr);
  cv.height = Math.round(H*scale*dpr);
  ctx.setTransform(cv.width/W, 0, 0, cv.height/H, 0, 0);
}
window.addEventListener('resize', resize);
resize();


/* =====================================================================
   3. SAVED SETTINGS: best score and mute (stored in the browser)
   ===================================================================== */

let best = 0;
try { best = +localStorage.getItem('terrabird-best') || 0; } catch(e){}

let coins = 0;
try { coins = +localStorage.getItem('terrabird-coins') || 0; } catch(e){}

function saveCoins(){
  try { localStorage.setItem('terrabird-coins', coins); } catch(e){}
}

let muted = false;
try { muted = localStorage.getItem('terrabird-mute') === '1'; } catch(e){}

const muteBtn = document.getElementById('mute');
function paintMute(){
  const cross = [[7,4],[8,5],[9,6],[10,7],[10,4],[9,5],[8,6],[7,7]]
    .map(p => '<rect x="' + p[0] + '" y="' + p[1] + '" width="1" height="1"/>').join('');
  const waves = '<rect x="7" y="4" width="1" height="4"/><rect x="9" y="3" width="1" height="6"/>';
  muteBtn.innerHTML = '<svg viewBox="0 0 12 12" width="24" height="24" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true">' +
    '<rect x="1" y="4" width="2" height="4"/><rect x="3" y="3" width="1" height="6"/><rect x="4" y="2" width="1" height="8"/>' +
    (muted ? cross : waves) + '</svg>';
}
paintMute();

muteBtn.addEventListener('pointerdown', e => e.stopPropagation());
muteBtn.addEventListener('click', e => {
  e.stopPropagation();
  muted = !muted;
  paintMute();
  try { localStorage.setItem('terrabird-mute', muted ? '1' : '0'); } catch(x){}
});


/* =====================================================================
   4. SOUND: simple synthesized beeps
   ===================================================================== */

let audio = null;
// Plays a beep that slides from pitch f1 to f2 over d seconds
function tone(f1, f2, d, type, vol){
  if (muted) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audio.createOscillator(), gain = audio.createGain(), t = audio.currentTime;
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(f1, t);
    osc.frequency.exponentialRampToValueAtTime(f2, t + d);
    gain.gain.setValueAtTime(vol || 0.06, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.connect(gain); gain.connect(audio.destination);
    osc.start(t); osc.stop(t + d);
  } catch(e){}
}


/* =====================================================================
   4a. ACHIEVEMENTS: goals, coin rewards, pop-ups
   ===================================================================== */

let stats = {totalPipes:0, flips:0, runs:0, purchases:0, dimEntered:0, dimsSeen:[], dimDeaths:0, dimReturns:0, marioCoins:0, hardCoins:0};   // lifetime counts
try { const q = JSON.parse(localStorage.getItem('terrabird-stats')); if (q && typeof q === 'object') Object.assign(stats, q); } catch(e){}
let unlocked = [];                                           // ids of finished achievements
try { const u = JSON.parse(localStorage.getItem('terrabird-ach')); if (Array.isArray(u)) unlocked = u; } catch(e){}

function saveStats(){
  try {
    localStorage.setItem('terrabird-stats', JSON.stringify(stats));
    localStorage.setItem('terrabird-ach', JSON.stringify(unlocked));
  } catch(e){}
}

// Current value used to unlock an achievement
// Lifetime value of a stat (lists, like dimsSeen, count their length)
function statValue(a){ const v = stats[a.stat]; return Array.isArray(v) ? v.length : (v || 0); }
function achValue(a){ return a.stat === 'score' ? score : statValue(a); }

const toasts = [];   // achievement pop-ups waiting to show

// Unlocks anything newly reached and pays the coin reward
function checkAchievements(){
  for (const a of ACHIEVEMENTS){
    if (unlocked.includes(a.id) || achValue(a) < a.goal) continue;
    unlocked.push(a.id);
    coins += a.reward; saveCoins(); saveStats();
    toasts.push({name:a.name, reward:a.reward, start:0});
    tone(523, 1046, 0.25, 'triangle', 0.07);
  }
}

// Pop-up at the bottom of the screen, one at a time
function drawToast(){
  if (!toasts.length || storeOpen) return;
  const t = toasts[0], now = performance.now();
  if (!t.start) t.start = now;
  if (now - t.start > 2600){ toasts.shift(); return; }
  ctx.fillStyle = '#1d2433'; ctx.fillRect(30, 548, W-60, 62);
  ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 4; ctx.strokeRect(34, 552, W-68, 54);
  text('ACHIEVEMENT', W/2, 574, 9, '#ffd23f');
  text(t.name + '  +' + t.reward, W/2, 596, 10, '#fff');
}


/* =====================================================================
   4b. STORE: saved purchases, store screen, buying and equipping
   ===================================================================== */

let owned = [];                                    // ids of items you own
let equipped = {skins:'skin-white', trails:'trail-none'};  // one item per tab
try { const o = JSON.parse(localStorage.getItem('terrabird-owned')); if (Array.isArray(o)) owned = o; } catch(e){}
try { const q = JSON.parse(localStorage.getItem('terrabird-equipped')); if (q && typeof q === 'object') Object.assign(equipped, q); } catch(e){}
for (const it of ITEMS) if (it.price === 0 && !owned.includes(it.id)) owned.push(it.id);

function saveStore(){
  try {
    localStorage.setItem('terrabird-owned', JSON.stringify(owned));
    localStorage.setItem('terrabird-equipped', JSON.stringify(equipped));
  } catch(e){}
}

// Colors of the equipped skin ({} if none), used by drawFox()
function skinColors(){
  const it = ITEMS.find(i => i.id === equipped.skins);
  return (it && it.colors) || {};
}

const storeBtn   = document.getElementById('storeBtn');
const storeEl    = document.getElementById('store');
const storeItems = document.getElementById('storeItems');
const storeCoins = document.getElementById('storeCoins');
const storeMsg   = document.getElementById('storeMsg');
let storeOpen = false, storeTab = 'skins', msgTimer = null;

function showMsg(t){
  storeMsg.textContent = t;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { storeMsg.textContent = ''; }, 1800);
}

function swatchStyle(it){
  if (it.colors) return 'background:linear-gradient(' + it.colors.P + ' 50%,' + it.colors.S + ' 50%)';
  return 'background:#8a5a2e';
}

function renderStore(){
  storeCoins.textContent = 'COINS ' + coins;
  for (const b of storeEl.querySelectorAll('.tabs button')) b.classList.toggle('on', b.dataset.tab === storeTab);
  if (storeTab === 'awards'){
    storeItems.innerHTML = ACHIEVEMENTS.map(a => {
      const done = unlocked.includes(a.id);
      const v = a.stat === 'score' ? best : statValue(a);
      const right = done ? 'DONE' : Math.min(v, a.goal) + '/' + a.goal + '<br>+' + a.reward;
      return '<div class="item"><div class="sw" style="background:' + (done ? '#7be0a4' : '#8a5a2e') + '"></div>' +
             '<div class="nm">' + a.name + '<br><span class="d">' + a.desc + '</span></div><div>' + right + '</div></div>';
    }).join('');
    return;
  }
  if (storeTab === 'soon'){ storeItems.innerHTML = '<div class="soon">COMING SOON</div>'; return; }
  storeItems.innerHTML = ITEMS.filter(i => i.tab === storeTab).map(i => {
    const has = owned.includes(i.id), on = equipped[i.tab] === i.id;
    const label = on ? 'EQUIPPED' : has ? 'EQUIP' : i.price + ' COINS';
    return '<div class="item"><div class="sw" style="' + swatchStyle(i) + '"></div>' +
           '<div class="nm">' + i.name + '</div>' +
           '<button data-id="' + i.id + '"' + (on ? ' disabled' : '') + '>' + label + '</button></div>';
  }).join('');
}

function buyOrEquip(id){
  const it = ITEMS.find(i => i.id === id);
  if (!it) return;
  if (!owned.includes(id)){
    if (coins < it.price){ showMsg('NOT ENOUGH COINS'); tone(200, 120, 0.15, 'square', 0.05); return; }
    coins -= it.price; saveCoins();
    owned.push(id);
    stats.purchases++; saveStats(); checkAchievements();
    tone(660, 990, 0.12, 'triangle', 0.07);
  }
  equipped[it.tab] = id;   // buying also equips
  saveStore();
  renderStore();
}

function openStore(){ storeOpen = true; storeEl.hidden = false; renderStore(); }
function closeStore(){ storeOpen = false; storeEl.hidden = true; }

storeBtn.addEventListener('click', openStore);
document.getElementById('storeClose').addEventListener('click', closeStore);
storeEl.querySelector('.tabs').addEventListener('click', e => {
  const t = e.target.closest('button');
  if (t){ storeTab = t.dataset.tab; renderStore(); }
});
storeItems.addEventListener('click', e => {
  const b = e.target.closest('button[data-id]');
  if (b) buyOrEquip(b.dataset.id);
});


/* =====================================================================
   5. GAME STATE
   ===================================================================== */

let state = 'ready';   // 'ready' | 'play' | 'over'
let paused = false;   // true while the game is paused
let y, dir, pipes, speed, score, lastCenter, nextX, tilt, rings, deadAt, shake, particles, trailTimer, dimension, dimCount, flash, banner, scrollX, trail, coinPops;

function reset(){
  y = H/2;          // fox height
  dir = 1;          // 1 = falling down, -1 = falling up
  pipes = [];
  speed = PIPE_SPEED_START;
  score = 0;
  lastCenter = H/2; // center of the most recent gap
  nextX = W + 60;   // where the next pipe will appear
  tilt = 0;
  rings = [];       // flip animation squares
  shake = 0;        // screen shake timer
  particles = [];   // trail particles
  trailTimer = 0;
  dimension = null; // null = home, otherwise a key of DIMENSIONS
  dimCount = 0;     // pipes passed inside the dimension
  flash = 0;        // white flash when switching dimensions
  banner = null;    // title shown after a switch
  scrollX = 0;      // background scroll distance
  trail = [];       // the fox's recent heights (the monster follows this path)
  coinPops = [];    // "+5" pop-ups
  while (nextX < W + PIPE_SPACING*2) spawn();
}


/* =====================================================================
   6. PIPES: creating gaps the fox can always reach
   ===================================================================== */

function gapSize(){ return Math.max(GAP_MIN, GAP_START - score*GAP_SHRINK); }

function spawn(){
  const gap = gapSize();
  const timeBetween = PIPE_SPACING / speed;
  const maxShift = FOX_SPEED * timeBetween * GAP_REACH;  // farthest the next gap may move
  const lo = GAP_MARGIN + gap/2, hi = floorY() - GAP_MARGIN - gap/2;

  let shift = (Math.random()*2 - 1) * maxShift;
  if (score >= EXTREME_FROM_SCORE && Math.random() < EXTREME_CHANCE){
    shift = (Math.random() < 0.5 ? -1 : 1) * maxShift * 0.98;  // big swing
  }
  const center = Math.min(hi, Math.max(lo, lastCenter + shift));
  lastCenter = center;

  // Some pipes are portals (home only). For testing, add a dimension name to the page address,
  // like #backrooms, to make every pipe a portal to it.
  const forced = typeof location !== 'undefined' ? location.hash.slice(1).replace(/\d+$/, '') : '';
  const forceId = (DIMENSIONS[forced] && DIMENSIONS[forced].ready) ? forced : null;
  const portal = dimension ? null : (forceId || (Math.random() < PORTAL_CHANCE ? pickDimension() : null));
  const pipe = {x:nextX, c:center, g:gap, scored:false, portal:portal, coin:null};
  pipes.push(pipe);
  if (dimension === 'mario' && pipes.length > 1) pipe.coin = makeCoin(pipes[pipes.length-2], pipe);
  nextX += PIPE_SPACING;
}


/* =====================================================================
   6b. TRAILS: particles left behind the glider
   ===================================================================== */

// Adds new particles for the equipped trail (called while playing)
function emitTrail(dt){
  const id = equipped.trails;
  if (id === 'trail-none') return;
  trailTimer += dt;
  while (trailTimer >= TRAIL_INTERVAL){
    trailTimer -= TRAIL_INTERVAL;
    const x = FOX_X - 22, jitter = (Math.random() - 0.5) * 8;
    if (id === 'trail-smoke')
      particles.push({k:'smoke', x:x, y:y + jitter, vx:-10, vy:(Math.random()-0.5)*20, life:0.7, max:0.7, size:6 + Math.random()*4});
    else if (id === 'trail-confetti')
      particles.push({k:'confetti', x:x, y:y + jitter, vx:-20 - Math.random()*50, vy:(Math.random()-0.5)*120, life:0.9, max:0.9, size:4,
                      color:CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)]});
    else if (id === 'trail-rainbow')
      particles.push({k:'rainbow', x:x, y:y, vx:0, vy:0, life:0.6, max:0.6, size:6,
                      color:RAINBOW_COLORS[Math.floor(performance.now()/60) % RAINBOW_COLORS.length]});
    else if (id === 'trail-gradient')
      particles.push({k:'gradient', x:x, y:y, vx:0, vy:0, life:0.6, max:0.6, size:8});
  }
}

// Moves and ages particles; they scroll left with the pipes while playing
function updateParticles(dt){
  const scroll = state === 'play' ? speed : 0;
  for (const p of particles){
    p.x += (p.vx - scroll) * dt;
    p.y += p.vy * dt;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
  for (const q of coinPops){ q.x -= scroll*dt; q.y -= 40*dt; q.life -= dt; }
  coinPops = coinPops.filter(q => q.life > 0);
}

function drawParticles(){
  for (const p of particles){
    const a = p.life / p.max;   // 1 = new, 0 = gone
    let size = p.size, color = p.color;
    if (p.k === 'smoke'){ color = '#c8c8d8'; size = p.size * (1 + (1 - a) * 0.6); }
    if (p.k === 'gradient'){ color = 'hsl(' + Math.round(50 + 230 * (1 - a)) + ',90%,60%)'; }
    size = Math.round(size);
    ctx.globalAlpha = a;
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(p.x - size/2), Math.round(p.y - size/2), size, size);
  }
  ctx.globalAlpha = 1;
  for (const q of coinPops){
    ctx.globalAlpha = Math.min(1, q.life / 0.3);
    text(q.text, q.x, q.y, 10, q.color);
  }
  ctx.globalAlpha = 1;
}


/* =====================================================================
   6c. DIMENSIONS: portal pipes, entering and leaving
   ===================================================================== */

let dimsCleared = [];   // dimensions you have escaped (the secret skins unlock from this, later)
try { const d = JSON.parse(localStorage.getItem('terrabird-cleared')); if (Array.isArray(d)) dimsCleared = d; } catch(e){}

function pickDimension(){
  const ids = Object.keys(DIMENSIONS).filter(k => DIMENSIONS[k].ready);
  return ids[Math.floor(Math.random() * ids.length)];
}

// Testing only: #backrooms42 in the page address starts you at pipe 42
function testStart(){
  const m = typeof location !== 'undefined' ? /^[a-z]+(\d+)$/.exec(location.hash.slice(1)) : null;
  return m ? +m[1] : 0;
}

// Clears the pipes and starts a fresh set, with the first gap near the fox
function restartPipes(){
  pipes = [];
  trail = [];
  lastCenter = Math.min(H - 100, Math.max(100, y));
  nextX = W + 60;
  while (nextX < W + PIPE_SPACING*2) spawn();
}

function enterDimension(id){
  dimension = id; dimCount = testStart();
  restartPipes();
  flash = 1; banner = {text:DIMENSIONS[id].name, start:0};
  stats.dimEntered++;
  if (!stats.dimsSeen.includes(id)) stats.dimsSeen.push(id);
  saveStats(); checkAchievements();
  tone(120, 60, 0.5, 'sawtooth', 0.08);
}

function exitDimension(){
  const id = dimension;
  dimension = null; dimCount = 0;
  restartPipes();
  flash = 1; banner = {text:'BACK HOME', start:0};
  stats.dimReturns++;
  markDimensionCleared(id);
  saveStats(); checkAchievements();
  tone(400, 900, 0.3, 'triangle', 0.07);
}

// Called when you ESCAPE a dimension (not when you die). The secret skin reward will hook in here.
function markDimensionCleared(id){
  if (dimsCleared.includes(id)) return;
  dimsCleared.push(id);
  try { localStorage.setItem('terrabird-cleared', JSON.stringify(dimsCleared)); } catch(e){}
}

// Called each time you pass a pipe inside a dimension (special events)
function dimensionStep(){
  if (dimension === 'backrooms' && dimCount === DIMENSIONS.backrooms.monsterFrom){
    banner = {text:'IT SEES YOU', start:0};
    tone(80, 40, 0.8, 'sawtooth', 0.08);
  }
}

// Backrooms monster: it follows YOUR path a moment behind, so it only catches you if you crash
function monsterActive(){ return dimension === 'backrooms' && dimCount >= DIMENSIONS.backrooms.monsterFrom; }
function monsterDelay(){   // seconds behind you; shrinks toward the exit
  const d = DIMENSIONS.backrooms;
  const t = Math.max(0, Math.min(1, (dimCount - d.monsterFrom) / (DIMENSION_PIPES - d.monsterFrom)));
  return d.monsterDelay[0] + (d.monsterDelay[1] - d.monsterDelay[0]) * t;
}
function monsterPos(){
  const delay = monsterDelay();
  const idx = trail.length - 1 - Math.round(delay / STEP);
  return {x: FOX_X - speed * delay, y: trail.length ? trail[Math.max(0, idx)] : y};
}


/* =====================================================================
   6d. MARIO COINS: placement math, pickup, drawing
   ===================================================================== */

function speedFor(s){ return Math.min(PIPE_SPEED_MAX, PIPE_SPEED_START + s*PIPE_SPEED_PER_POINT); }
function distToRange(v, lo, hi){ return v < lo ? lo - v : v > hi ? v - hi : 0; }
function farFromRange(v, lo, hi){ return Math.max(Math.abs(v - lo), Math.abs(v - hi)); }
function floorY(){ return dimension === 'mario' ? H - MARIO_GROUND : H; }

// a = pipe the fox just passed, b = the next pipe. Returns a coin stored on b, or null.
function makeCoin(a, b){
  if (Math.random() > MARIO_COIN_CHANCE) return null;
  const R = FOX_RADIUS, PICK = FOX_RADIUS + COIN_R;     // fox grabs a coin within PICK px vertically
  const k = speedFor(score + 3) / FOX_SPEED;            // scroll px per px of fox travel (speed when this pair arrives)
  const F = PIPE_SPACING - PIPE_W - 2*R;                // scroll distance between "passed a" and "b arrives"
  const L = F / k;                                      // how far the fox can fly in that time
  const a0 = a.c - a.g/2 + R, a1 = a.c + a.g/2 - R;     // safe heights inside gap a
  const b0 = b.c - b.g/2 + R, b1 = b.c + b.g/2 - R;     // safe heights inside gap b
  const yMin = R + 4, yMax = floorY() - R - 4;

  // 1. Test every height; keep the ones that fit a tier
  const found = COIN_TIERS.map(() => []);
  for (let cy = yMin; cy <= yMax; cy += COIN_STEP){
    const dN = Math.max(0, distToRange(cy, a0, a1)  - PICK);   // start gap a from the best spot
    const dF = Math.max(0, farFromRange(cy, a0, a1) - PICK);   // start gap a from the worst spot
    const dB = Math.max(0, distToRange(cy, b0, b1)  - PICK);   // land in gap b at the best spot
    const best = (L - dN - dB) / L, worst = (L - dF - dB) / L;
    COIN_TIERS.forEach((t, i) => {
      if (best >= t.best[0] && best <= t.best[1] && worst >= t.worst[0] && worst <= t.worst[1])
        found[i].push({cy:cy, dA:t.safe ? dF : dN, dB:dB});
    });
  }

  // 2. Pick a tier by weight (only tiers that have a valid height)
  let total = 0;
  const wts = COIN_TIERS.map((t, i) => {
    const v = found[i].length ? Math.max(0, t.weight + t.ramp*dimCount) : 0;
    total += v; return v;
  });
  if (total <= 0) return null;
  let r = Math.random()*total, ti = 0;
  for (; ti < wts.length - 1; ti++){ if (r < wts[ti]) break; r -= wts[ti]; }

  // 3. Pick a height, then put the coin in the middle of its timing window
  const c = found[ti][Math.floor(Math.random()*found[ti].length)];
  const u = F/2 + k*(c.dA - c.dB)/2;                    // scroll distance after passing a
  const w = Math.max(COIN_R + 8, R + F - u);            // px in front of pipe b
  return {w:w, y:c.cy, tier:ti, got:false};
}

function collectCoins(){
  for (const p of pipes){
    const c = p.coin;
    if (!c || c.got) continue;
    const cx = p.x - c.w;
    if (Math.abs(cx - FOX_X) < FOX_RADIUS + COIN_R && Math.abs(c.y - y) < FOX_RADIUS + COIN_R){
      const t = COIN_TIERS[c.tier];
      c.got = true;
      coins += t.value; saveCoins();
      stats.marioCoins++; if (t.name === 'hard') stats.hardCoins++;
      saveStats(); checkAchievements();
      coinPops.push({x:cx, y:c.y, text:'+' + t.value, color:t.color, life:0.8});
      tone(988, 988, 0.07, 'square', 0.06);
      setTimeout(() => tone(1319, 1319, 0.3, 'square', 0.06), 70);
    }
  }
}

function drawMarioCoins(){
  const hw = [7, 5, 2, 5][Math.floor(performance.now() / 110) % 4];   // coin "spins"
  for (const p of pipes){
    const c = p.coin;
    if (!c || c.got) continue;
    const cx = Math.round(p.x - c.w), cy = Math.round(c.y);
    if (cx < -20 || cx > W + 20) continue;
    const t = COIN_TIERS[c.tier];
    ctx.fillStyle = '#000';  ctx.fillRect(cx - hw - 2, cy - 12, hw*2 + 4, 24);
    ctx.fillStyle = t.color; ctx.fillRect(cx - hw, cy - 10, hw*2, 20);
    if (hw > 3){ ctx.fillStyle = t.shine; ctx.fillRect(cx - hw + 2, cy - 8, 2, 14); }
  }
}


/* =====================================================================
   7. GAME ACTIONS: flip, die, collision
   ===================================================================== */

const pauseBtn = document.getElementById('pauseBtn');
function setPaused(v){ paused = v; }
pauseBtn.addEventListener('pointerdown', e => e.stopPropagation());
pauseBtn.addEventListener('click', e => { e.stopPropagation(); if (state === 'play') setPaused(!paused); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') setPaused(true); });

function flip(){
  if (paused){ setPaused(false); return; }   // any tap or key resumes
  if (state === 'ready'){ state = 'play'; }
  else if (state === 'over'){
    if (performance.now() - deadAt > 450){ reset(); state = 'ready'; }
    return;
  }
  stats.flips++; saveStats(); checkAchievements();
  dir = -dir;
  rings.push({x:FOX_X, y:y, r:FOX_RADIUS, a:1});
  tone(dir > 0 ? 330 : 520, dir > 0 ? 520 : 330, 0.09, 'square', 0.05);
}

function die(){
  state = 'over';
  deadAt = performance.now();
  shake = 0.25;
  tone(220, 50, 0.35, 'sawtooth', 0.09);
  if (score > best){
    best = score;
    try { localStorage.setItem('terrabird-best', best); } catch(e){}
  }
  if (dimension) stats.dimDeaths++;
  stats.runs++; saveStats(); checkAchievements();
}

// True if the fox overlaps pipe p
function hit(p){
  if (FOX_X + FOX_RADIUS < p.x || FOX_X - FOX_RADIUS > p.x + PIPE_W) return false;
  return y - FOX_RADIUS < p.c - p.g/2 || y + FOX_RADIUS > p.c + p.g/2;
}


/* =====================================================================
   8. UPDATE: runs 120 times per second; dt = seconds per step
   ===================================================================== */

function update(dt){
  if (paused) return;   // frozen while paused
  // Effects keep running in every state
  for (const r of rings){ r.r += 90*dt; r.a -= 3*dt; }
  rings = rings.filter(r => r.a > 0);
  updateParticles(dt);
  if (shake > 0) shake -= dt;
  if (flash > 0) flash -= dt*2.5;

  // Title screen: fox bobs gently, nothing else moves
  if (state !== 'play'){
    if (state === 'ready') y = H/2 + Math.sin(performance.now()/260) * 10;
    return;
  }

  // Fox: constant speed, direction set by dir
  y += dir * FOX_SPEED * dt;
  if (dimension){ trail.push(y); if (trail.length > 240) trail.shift(); }
  emitTrail(dt);
  tilt += (dir*0.5 - tilt) * Math.min(1, dt*14);  // smooth visual tilt

  // Pipes: speed up with score, scroll left
  speed = Math.min(PIPE_SPEED_MAX, PIPE_SPEED_START + score*PIPE_SPEED_PER_POINT);
  scrollX += speed*dt;
  for (const p of pipes) p.x -= speed*dt;
  nextX -= speed*dt;

  // Remove pipes that left the screen, add new ones on the right
  if (pipes.length && pipes[0].x + PIPE_W < -10) pipes.shift();
  while (nextX < W + PIPE_SPACING) spawn();

  // Scoring and pipe collisions
  for (const p of pipes){
    if (!p.scored && p.x + PIPE_W < FOX_X - FOX_RADIUS){
      p.scored = true;
      score++;
      coins += COIN_PER_PIPE * (dimension ? DIMENSION_COIN_MULT : 1);
      saveCoins();
      stats.totalPipes++; saveStats(); checkAchievements();
      tone(660, 990, 0.12, 'triangle', 0.07);
      if (dimension){
        dimCount++;
        dimensionStep();
        if (dimCount >= DIMENSION_PIPES){ exitDimension(); return; }
      }
    }
    if (hit(p)){
      if (p.portal && !dimension) enterDimension(p.portal);   // crashing into a portal pipe is not fatal
      else die();
      return;
    }
  }

  if (dimension === 'mario') collectCoins();

  // Ceiling and floor
  const floor = floorY();
  if (y - FOX_RADIUS < 0 || y + FOX_RADIUS > floor){
    y = Math.max(FOX_RADIUS, Math.min(floor - FOX_RADIUS, y));
    die();
  }
}


/* =====================================================================
   9. DRAWING HELPERS: fox, pipes, text
   ===================================================================== */

function drawFox(){
  const skin = skinColors();
  ctx.save();
  ctx.translate(FOX_X, Math.round(y));
  ctx.scale(1, dir);                  // flips the fox upside-down when dir is -1
  ctx.rotate(tilt * 0.25 * dir);
  for (let r = 0; r < FOX_SPRITE.length; r++){
    for (let c = 0; c < 16; c++){
      const ch = FOX_SPRITE[r][c];
      if (ch !== '.'){
        ctx.fillStyle = skin[ch] || FOX_COLORS[ch];
        ctx.fillRect(-24 + c*SPRITE_PIXEL, -16 + r*SPRITE_PIXEL, SPRITE_PIXEL, SPRITE_PIXEL);
      }
    }
  }
  ctx.restore();
}

function pipeColors(p){
  if (dimension) return DIMENSIONS[dimension].wall || PIPE_COLORS;
  if (p.portal) return DIMENSIONS[p.portal].pipe || PIPE_COLORS;   // each dimension sets its own portal look
  return PIPE_COLORS;
}

function drawPipe(p){
  const top = Math.round(p.c - p.g/2);   // where the upper pillar ends
  const bot = Math.round(p.c + p.g/2);   // where the lower pillar starts
  const x = Math.round(p.x);
  const C = pipeColors(p);
  const walls = dimension === 'backrooms';   // striped wallpaper slabs instead of pillars
  const mario = dimension === 'mario';

  function body(yy, h){
    ctx.fillStyle = C.body;  ctx.fillRect(x, yy, PIPE_W, h);
    if (walls){
      ctx.fillStyle = C.light;
      for (let sx = x + 6; sx < x + PIPE_W; sx += 12) ctx.fillRect(sx, yy, 4, h);
    } else {
      ctx.fillStyle = C.light; ctx.fillRect(x+6, yy, 6, h);
      ctx.fillStyle = C.dark;  ctx.fillRect(x+PIPE_W-10, yy, 10, h);
    }
    ctx.strokeStyle = C.outline; ctx.lineWidth = 4; ctx.strokeRect(x, yy, PIPE_W, h);
  }
  function cap(yy){
    if (mario){   // same green as the body, light stripe left, dark stripe right
      ctx.fillStyle = C.body;  ctx.fillRect(x-6, yy, PIPE_W+12, 18);
      ctx.fillStyle = C.light; ctx.fillRect(x+6, yy, 6, 18);
      ctx.fillStyle = C.dark;  ctx.fillRect(x+PIPE_W-10, yy, 16, 18);
    } else {
      ctx.fillStyle = C.light; ctx.fillRect(x-6, yy, PIPE_W+12, 18);
      ctx.fillStyle = C.dark;  ctx.fillRect(x-6, yy+12, PIPE_W+12, 6);
    }
    ctx.strokeStyle = C.outline; ctx.lineWidth = 4; ctx.strokeRect(x-6, yy, PIPE_W+12, 18);
  }
  function trim(yy){   // wall edge trim
    ctx.fillStyle = C.dark; ctx.fillRect(x-3, yy, PIPE_W+6, 8);
    ctx.strokeStyle = C.outline; ctx.lineWidth = 3; ctx.strokeRect(x-3, yy, PIPE_W+6, 8);
  }

  body(-4, top+4);        // upper pillar
  body(bot, H-bot+4);     // lower pillar
  if (walls){ trim(top-8); trim(bot); } else { cap(top-18); cap(bot); }
}

// Paints the dimension's room over the sky
function drawDimension(){
  const d = DIMENSIONS[dimension];
  if (dimension === 'backrooms'){
    ctx.fillStyle = d.wallpaper; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = d.stripe;                       // wallpaper stripes drift slowly
    const off = Math.floor(scrollX * 0.4) % 24;
    for (let sx = -off; sx < W; sx += 24) ctx.fillRect(sx, 0, 6, H);
    ctx.fillStyle = d.carpet; ctx.fillRect(0, H-70, W, 70);          // carpet
    ctx.fillStyle = d.wall.dark; ctx.fillRect(0, H-74, W, 4);        // baseboard
    ctx.fillStyle = d.carpetDot;
    const co = Math.floor(scrollX * 0.8) % 16;
    for (let r = 0; r < 4; r++) for (let cx = -co + (r%2)*8; cx < W; cx += 16) ctx.fillRect(cx, H-62 + r*14, 3, 3);
    ctx.fillStyle = d.ceiling; ctx.fillRect(0, 0, W, 12);            // ceiling with flickering lights
    const lo = Math.floor(scrollX * 0.6) % 120;
    for (let k = 0; k < 4; k++){
      const lvl = Math.min(d.flicker.length - 1, Math.floor(dimCount / 10));   // more flicker every 10 pipes
      const r = Math.abs(Math.sin(Math.floor(performance.now()/90) * 12.9898 + k * 78.233) * 43758.5453) % 1;
      const on = r >= d.flicker[lvl];
      ctx.fillStyle = on ? d.light : d.ceiling;
      ctx.fillRect(k*120 - lo + 30, 3, 50, 6);
    }
  }
  if (dimension === 'mario') drawMarioBackground(d);
}

function drawMarioBackground(d){
  const base = H - MARIO_GROUND;
  ctx.fillStyle = d.sky; ctx.fillRect(0, 0, W, H);

  const span = W + 120, co = scrollX * 0.15;                       // clouds drift slowly
  for (const c of [[20,110],[190,60],[300,200]]){
    const cx = Math.round(((c[0] - co) % span + span) % span) - 64;
    marioCloud(cx, c[1], d);
  }
  const P = 540, ho = (scrollX * 0.35) % P;                        // hills scroll a bit faster
  for (const h of [[10,170,96],[300,100,56]])
    for (let rep = -1; rep <= 1; rep++) marioHill(h[0] - ho + rep*P, base, h[1], h[2], d);
}

function marioCloud(x, yy, d){
  const rows = [[2,2],[1,5],[0,8],[1,6]];   // [first block, blocks wide] per 8px row
  rows.forEach((r, i) => {
    ctx.fillStyle = i === 3 ? d.cloudShade : d.cloud;
    ctx.fillRect(x + r[0]*8, yy + i*8, r[1]*8, 8);
  });
}

function marioHill(x, base, w, h, d){
  const rows = Math.floor(h / 8);
  for (let r = 0; r < rows; r++){
    const inset = Math.round(r * (w/2 - 8) / rows);
    const rx = Math.round(x) + inset, rw = w - inset*2, ry = base - (r+1)*8;
    ctx.fillStyle = d.hill;     ctx.fillRect(rx, ry, rw, 8);
    ctx.fillStyle = d.hillDark; ctx.fillRect(rx, ry, 4, 8); ctx.fillRect(rx + rw - 4, ry, 4, 8);
  }
  ctx.fillStyle = '#003800';                                       // the little eyes
  const ex = Math.round(x + w/2), ey = base - Math.round(h*0.45);
  ctx.fillRect(ex - 10, ey, 4, 12); ctx.fillRect(ex + 6, ey, 4, 12);
}

function drawMarioGround(){   // drawn AFTER the pipes so they look planted in it
  const d = DIMENSIONS.mario, gy = H - MARIO_GROUND, off = Math.floor(scrollX) % 16;
  for (let r = 0; r < MARIO_GROUND/16; r++){
    for (let tx = -off; tx < W; tx += 16){
      const ty = gy + r*16;
      ctx.fillStyle = d.brick;      ctx.fillRect(tx, ty, 16, 16);
      ctx.fillStyle = d.brickLight; ctx.fillRect(tx, ty, 16, 2); ctx.fillRect(tx, ty, 2, 16);
      ctx.fillStyle = d.brickLine;  ctx.fillRect(tx + 14, ty, 2, 16); ctx.fillRect(tx, ty + 14, 16, 2);
    }
  }
}

// Backrooms: the room goes darker as the lights fail, leaving a glow around the fox
function drawDarkness(){
  if (dimension !== 'backrooms') return;
  const d = DIMENSIONS.backrooms;
  const a = d.dark[Math.min(d.dark.length - 1, Math.floor(dimCount / 10))];
  if (!a) return;
  const g = ctx.createRadialGradient(FOX_X, y, 40, FOX_X, y, 260);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,' + a + ')');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function drawMonster(){
  if (!monsterActive()) return;
  let m = monsterPos();
  if (state === 'over'){   // you crashed: it catches up
    const k = Math.min(1, (performance.now() - deadAt) / 400);
    m = {x: m.x + (FOX_X - 24 - m.x) * k, y: m.y + (y - m.y) * k};
  }
  const x = Math.round(m.x), yy = Math.round(m.y);
  ctx.fillStyle = '#050505';
  ctx.fillRect(x-20, yy-26, 40, 52);                                   // body
  ctx.fillRect(x-26, yy-14, 6, 30); ctx.fillRect(x+20, yy-14, 6, 30);  // arms
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x-12, yy-14, 6, 6); ctx.fillRect(x+6, yy-14, 6, 6);     // eyes
  for (let i = -3; i <= 3; i++) ctx.fillRect(x + i*4 - 1, yy + 4 + (Math.abs(i) % 2)*4, 3, 3);   // jagged grin
}

function drawBanner(){
  if (!banner) return;
  const now = performance.now();
  if (!banner.start) banner.start = now;
  if (now - banner.start > 2200){ banner = null; return; }
  text(banner.text, W/2, 170, 16, '#fff');
}

function drawCoin(x, yy){
  ctx.fillStyle = '#1d2433'; ctx.fillRect(x, yy, 14, 14);
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(x+2, yy+2, 10, 10);
  ctx.fillStyle = '#fff3b0'; ctx.fillRect(x+4, yy+4, 3, 3);
}

// Text with a dark drop shadow
function text(s, x, yy, size, color, align){
  ctx.font = size + 'px "Press Start 2P",monospace';
  ctx.textAlign = align || 'center';
  ctx.fillStyle = '#1d2433'; ctx.fillText(s, x+3, yy+3);
  ctx.fillStyle = color || '#fff'; ctx.fillText(s, x, yy);
}
try { document.fonts.load('16px "Press Start 2P"'); } catch(e){}

// --- Time-of-day sky ---
function hexToRgb(h){ return [1,3,5].map(i => parseInt(h.substr(i,2),16)); }
function mixColor(a, b, t){
  const x = hexToRgb(a), y = hexToRgb(b);
  return 'rgb(' + x.map((v,i) => Math.round(v + (y[i]-v)*t)).join(',') + ')';
}
function computeSky(hour){
  let i = 0;
  while (i < SKY_SCHEDULE.length - 2 && hour >= SKY_SCHEDULE[i+1][0]) i++;
  const h0 = SKY_SCHEDULE[i][0], h1 = SKY_SCHEDULE[i+1][0];
  const a = SKY_PALETTES[SKY_SCHEDULE[i][1]], b = SKY_PALETTES[SKY_SCHEDULE[i+1][1]];
  const t = Math.min(1, Math.max(0, (hour - h0) / (h1 - h0)));
  return {sky: a.sky.map((c,k) => mixColor(c, b.sky[k], t)), cloud: mixColor(a.cloud, b.cloud, t), stars: a.stars + (b.stars - a.stars)*t};
}
// The player's local time. For testing, add #18 (an hour) to the page address.
function currentHour(){
  const forced = typeof location !== 'undefined' ? parseFloat(location.hash.slice(1)) : NaN;
  if (!isNaN(forced)) return forced % 24;
  const d = new Date();
  return d.getHours() + d.getMinutes()/60;
}
let skyNow = computeSky(currentHour());
function refreshSky(){ skyNow = computeSky(currentHour()); }
setInterval(refreshSky, 30000);
window.addEventListener('hashchange', refreshSky);


/* =====================================================================
   10. DRAW: paints one frame (back to front)
   ===================================================================== */

function draw(){
  const showStoreBtn = state === 'ready' && !storeOpen;   // icon only on the title screen
  if (storeBtn.hidden === showStoreBtn) storeBtn.hidden = !showStoreBtn;
  const showPause = state === 'play';   // pause button only while playing
  if (pauseBtn.hidden === showPause) pauseBtn.hidden = !showPause;
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*8, (Math.random()-0.5)*8);

  // Sky
  const bandH = Math.ceil(H / skyNow.sky.length);
  for (let i = 0; i < skyNow.sky.length; i++){
    ctx.fillStyle = skyNow.sky[i];
    ctx.fillRect(-10, i*bandH, W+20, bandH+1);
  }
  if (skyNow.stars > 0.01){
    ctx.globalAlpha = skyNow.stars;
    ctx.fillStyle = '#ffffff';
    for (const s of STARS) ctx.fillRect(s[0], s[1], 3, 3);
    ctx.globalAlpha = 1;
  }

  // Drifting clouds
  ctx.fillStyle = skyNow.cloud;
  for (let i = 0; i < 3; i++){
    const cx = Math.round(((i*170 - (performance.now()/90)*(1+i*0.3)) % (W+160) + W+160) % (W+160) - 80);
    const cy = 300 + i*110;
    ctx.fillRect(cx, cy, 64, 12);
    ctx.fillRect(cx+12, cy-12, 36, 12);
  }

  // Dimension background (covers the sky)
  if (dimension) drawDimension();

  // Pipes
  for (const p of pipes) drawPipe(p);
  if (dimension === 'mario'){ drawMarioGround(); drawMarioCoins(); }

  // Ceiling and floor bars
  if (dimension !== 'mario'){
  const room = dimension === 'backrooms' ? DIMENSIONS.backrooms : null;
  ctx.fillStyle = room ? room.ceiling : '#1d2433'; ctx.fillRect(0, 0, W, 8);
  ctx.fillStyle = room ? room.carpet : '#1d2433';  ctx.fillRect(0, H-8, W, 8);
  if (!room){
    ctx.fillStyle = '#3a4466';
    for (let i = 0; i < W; i += 16){ ctx.fillRect(i, 2, 8, 4); ctx.fillRect(i+8, H-6, 8, 4); }
  }
  }

  // Flip animation squares
  for (const r of rings){
    ctx.strokeStyle = 'rgba(255,255,255,' + r.a + ')';
    ctx.lineWidth = 3;
    ctx.strokeRect(Math.round(r.x-r.r), Math.round(r.y-r.r), Math.round(r.r*2), Math.round(r.r*2));
  }

  drawParticles();   // trail sits behind the fox
  drawFox();
  drawDarkness();   // backrooms: lights failing
  drawMonster();

  // Screens
  if (state === 'play'){
    text(score, W/2, 84, 32, '#fff');
    drawCoin(W/2 - 36, 104);
    text(coins, W/2 - 16, 116, 12, '#ffd23f', 'left');
    if (dimension) text(dimCount + '/' + DIMENSION_PIPES, W/2, 150, 10, '#fff');
  }
  if (state === 'ready'){
    text('TERRABIRD', W/2, 190, 28, '#ffd23f');
    text('TAP / CLICK / SPACE', W/2, 430, 10, '#fff');
    text('TO FLIP GRAVITY', W/2, 454, 10, '#fff');
    text('BEST ' + best, W/2, 500, 12, '#ffd9a0');
    drawCoin(W/2 - 36, 520);
    text(coins, W/2 - 16, 532, 12, '#ffd23f', 'left');
  }
  if (state === 'over'){
    ctx.fillStyle = '#1d2433'; ctx.fillRect(36, 196, W-72, 232);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.strokeRect(40, 200, W-80, 224);
    text('GAME OVER', W/2, 255, 22, '#ff6a4d');
    text('SCORE ' + score, W/2, 310, 14, '#fff');
    text('BEST ' + best, W/2, 346, 14, '#ffd9a0');
    text('TAP TO RETRY', W/2, 396, 11, '#fff');
    drawCoin(W/2 - 36, 360);
    text(coins, W/2 - 16, 372, 12, '#ffd23f', 'left');
  }
  if (paused){
    ctx.fillStyle = '#000a'; ctx.fillRect(0, 0, W, H);
    text('PAUSED', W/2, 300, 26, '#ffd23f');
    text('TAP OR PRESS ANY KEY', W/2, 346, 9, '#fff');
    text('TO RESUME', W/2, 366, 9, '#fff');
  }
  if (flash > 0){ ctx.globalAlpha = Math.min(1, flash); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  drawBanner();
  drawToast();

  ctx.restore();
}


/* =====================================================================
   11. INPUT: click / tap / keyboard
   ===================================================================== */

window.addEventListener('pointerdown', e => {
  if (e.target.closest('#mute, #pauseBtn, #storeBtn, #store')) return;
  e.preventDefault();
  try { window.focus(); cv.focus(); } catch(x){}
  flip();
});

// Registered on both window and document; the _h flag makes sure one key press counts once
function onKey(e){
  if (e._h) return;
  e._h = 1;
  if (storeOpen){ if (e.code === 'Escape') closeStore(); return; }   // game keys off while store is open
  if (e.code === 'KeyP' || e.code === 'Escape'){ if (state === 'play') setPaused(!paused); return; }
  if (['Space','ArrowUp','ArrowDown','Enter'].includes(e.code)){
    e.preventDefault();
    if (!e.repeat) flip();
  }
}
window.addEventListener('keydown', onKey, true);
document.addEventListener('keydown', onKey, true);


/* =====================================================================
   12. GAME LOOP: fixed-timestep physics, drawing every frame
   ===================================================================== */

let accumulator = 0, lastTime = performance.now();

function loop(now){
  accumulator += Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;
  while (accumulator >= STEP){ update(STEP); accumulator -= STEP; }
  draw();
  requestAnimationFrame(loop);
}

cv.focus();
reset();
requestAnimationFrame(loop);

})();
</script>
